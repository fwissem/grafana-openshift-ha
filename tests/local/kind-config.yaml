# kind cluster for the local functional test.
#
# Same layout as production: two data zones with two workers each, plus one
# worker in a quorum zone where nothing of Grafana may run.
#   zone-a, zone-b : data zones (Grafana, PostgreSQL, backups)
#   zone-c         : quorum zone (must stay empty of Grafana workloads)
#
# Ports: rootful Podman on WSL publishes container ports with firewall
# redirects inside the Podman machine, with no listening socket, so WSL does not
# forward them to Windows. run-test.ps1 opens an SSH tunnel through the Podman
# machine instead (Podman's own SSH key), and points kubectl at 127.0.0.1.
#   Kubernetes API : https://127.0.0.1:6445
#   Grafana        : http://localhost:3300 (NodePort 30300)
#
# Plugins: the data-zone workers share one folder of the Podman machine
# (/var/lib/grafana-ha-plugins, created by run-test.ps1), mounted at
# /shared/grafana-plugins. A hostPath PersistentVolume on it plays the role of
# the ReadWriteMany volume grafana-plugins used on OpenShift.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: grafana-ha
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6445
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "127.0.0.1"
        - "localhost"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3300
        listenAddress: "0.0.0.0"
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
    extraMounts:
      - hostPath: /var/lib/grafana-ha-plugins
        containerPath: /shared/grafana-plugins
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
    extraMounts:
      - hostPath: /var/lib/grafana-ha-plugins
        containerPath: /shared/grafana-plugins
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
    extraMounts:
      - hostPath: /var/lib/grafana-ha-plugins
        containerPath: /shared/grafana-plugins
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
    extraMounts:
      - hostPath: /var/lib/grafana-ha-plugins
        containerPath: /shared/grafana-plugins
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
