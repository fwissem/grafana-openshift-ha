apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Restore job for the kind test cluster: same arbitrary UID as PostgreSQL.
namespace: grafana

resources:
  - ../../../manifests/restore

# Same image as production, community build: registry.redhat.io needs a Red Hat
# login, quay.io/sclorg/postgresql-16-c9s does not (same scripts and variables).
images:
  - name: registry.redhat.io/rhel9/postgresql-16
    newName: quay.io/sclorg/postgresql-16-c9s
    newTag: latest

patches:
  - target:
      kind: Job
      name: grafana-db-restore
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000700000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000700000
