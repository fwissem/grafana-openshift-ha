# Static checks on every push and pull request. Nothing is deployed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_VERSION: "13.3.1"

jobs:
  lint:
    name: Shell and YAML lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -x scripts/*.sh scripts/lib/*.sh tests/openshift/*.sh tests/local/*.sh .githooks/pre-commit
      - name: no CRLF in shell scripts
        run: |
          if grep -rlI $'\r' --include='*.sh' .; then echo "CRLF found"; exit 1; fi
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable, indentation: disable}}' manifests values tests .github

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render:
    name: Render manifests and chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: kustomize build (kind and OpenShift overlays)
        run: |
          kubectl kustomize manifests/overlays/kind > /tmp/kind.yaml
          kubectl kustomize manifests/overlays/openshift > /tmp/openshift.yaml
          kubectl kustomize manifests/restore > /tmp/restore.yaml
          grep -c '^kind:' /tmp/kind.yaml /tmp/openshift.yaml /tmp/restore.yaml
      - name: helm template with the public values
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm pull grafana-community/grafana --version "$CHART_VERSION" --untar --untardir charts
          cp values/values-local.yaml.example values/values-local.yaml
          helm template grafana charts/grafana -n grafana \
            -f values/values.yaml -f values/values-openshift.yaml -f values/values-local.yaml > /tmp/grafana.yaml
          helm template grafana charts/grafana -n grafana \
            -f values/values.yaml -f tests/local/values-kind.yaml -f tests/local/values-test-datasources.yaml > /tmp/grafana-kind.yaml
          grep -c '^kind:' /tmp/grafana.yaml /tmp/grafana-kind.yaml
      - name: no fixed UID or GID in the OpenShift render (restricted-v2 SCC)
        run: |
          if grep -nE 'runAsUser|runAsGroup|fsGroup' /tmp/grafana.yaml /tmp/openshift.yaml /tmp/restore.yaml; then
            echo "fixed UID/GID found in an OpenShift manifest"; exit 1
          fi
      - name: validate against Kubernetes schemas (kubeconform)
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas -skip Route,ServiceMonitor,PrometheusRule \
            /tmp/kind.yaml /tmp/openshift.yaml /tmp/restore.yaml /tmp/grafana.yaml /tmp/grafana-kind.yaml

  plugins:
    name: Plugins load in the official Grafana image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: unpack as load-plugins.sh does, run the official image, check every plugin
        run: |
          set -euo pipefail
          # Errors are also written as annotations, readable without repository rights.
          fail() { echo "::error::$1"; exit 1; }
          . scripts/lib/common.sh
          mkdir -p /tmp/plugins
          while read -r pid pver; do
            unzip -q "plugins/$pid-$pver.zip" -d /tmp/plugins
          done < <(verify_plugin_archives)
          chmod -R a+rX /tmp/plugins
          image="$(sed -n 's/^  tag: "\(.*\)"$/\1/p' values/values.yaml | head -n 1)"
          [ -n "$image" ] || fail "no image tag found in values/values.yaml"
          # Throwaway Grafana for this check only: anonymous users are Admin so the
          # plugin API needs no credentials. Plugins mounted read-only where the
          # init container copies them in the cluster.
          docker run -d --name grafana-ci -p 3000:3000 \
            -v /tmp/plugins:/opt/grafana/plugins:ro \
            -e GF_PATHS_PLUGINS=/opt/grafana/plugins \
            -e GF_PLUGINS_PREINSTALL_DISABLED=true \
            -e GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED=true \
            -e GF_AUTH_ANONYMOUS_ENABLED=true -e GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
            "docker.io/grafana/grafana:$image" > /tmp/run.log 2>&1 || fail "docker run: $(tr '\n' ' ' < /tmp/run.log)"
          up=no
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/health > /dev/null; then up=yes; break; fi
            sleep 2
          done
          [ "$up" = yes ] || fail "Grafana not healthy: $(docker logs grafana-ci 2>&1 | tail -n 5 | tr '\n' ' ')"
          rc=0
          while read -r pid pver _; do
            case "$pid" in ''|'#'*) continue ;; esac
            got="$(curl -s "http://localhost:3000/api/plugins/$pid/settings" | jq -r '"\(.info.version) \(.signature)"' 2>/dev/null || true)"
            echo "$pid: $got (expected $pver valid)"
            if [ "$got" != "$pver valid" ]; then
              echo "::error::$pid: got '$got', expected '$pver valid'"; rc=1
            fi
          done < values/plugins.lock
          docker logs grafana-ci > /tmp/grafana.log 2>&1
          if grep -E 'Installing plugin' /tmp/grafana.log; then echo "::error::Grafana tried to download plugins"; rc=1; fi
          { grep -E 'level=(error|warn)' /tmp/grafana.log | grep -i plugin || true; } | head -n 5 | while read -r l; do echo "::warning::$l"; done
          exit $rc
