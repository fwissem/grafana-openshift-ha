# Public entry point of Grafana. Edge TLS with the router certificate; HTTP is
# redirected to HTTPS. The host is set by scripts/install.sh (ROUTE_HOST).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: grafana
  annotations:
    # Spread requests over all replicas (sessions live in PostgreSQL).
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: "true"
    haproxy.router.openshift.io/timeout: 120s
spec:
  host: grafana.apps.cluster.example.com
  to:
    kind: Service
    name: grafana
    weight: 100
  port:
    targetPort: service
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
