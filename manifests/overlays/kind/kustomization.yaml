apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local test cluster (kind). Mimics OpenShift restricted-v2: pods run with an
# arbitrary high UID and an fsGroup, never as root and never as the image user.
namespace: grafana

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: grafana-postgresql
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000700000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000700000
  - target:
      kind: CronJob
      name: grafana-db-backup
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 1000700000
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 1000700000
