apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local test cluster (kind). Mimics OpenShift restricted-v2: pods run with an
# arbitrary high UID and an fsGroup, never as root and never as the image user.
namespace: grafana

resources:
  - ../../base

# Same image as production, community build: registry.redhat.io needs a Red Hat
# login, quay.io/sclorg/postgresql-16-c9s does not (same scripts and variables).
images:
  - name: registry.redhat.io/rhel9/postgresql-16
    newName: quay.io/sclorg/postgresql-16-c9s
    newTag: latest

patches:
  - target:
      kind: StatefulSet
      name: grafana-postgresql
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000700000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000700000
  - target:
      kind: CronJob
      name: grafana-db-backup
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
        value: 1000700000
      - op: add
        path: /spec/jobTemplate/spec/template/spec/securityContext/fsGroup
        value: 1000700000
