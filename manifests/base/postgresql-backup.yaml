# Daily logical backup of the Grafana database (pg_dump custom format) to a
# dedicated volume, keeping the last KEEP_BACKUPS dumps.
#
# The backup volume is in the same cluster as the database: it protects against
# a bad change or a corrupted database, not against losing the cluster. Copy the
# dumps off-cluster as well (see docs/RUNBOOK.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-db-backup
  labels:
    app.kubernetes.io/name: grafana-db-backup
    app.kubernetes.io/part-of: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName is set by the overlay (default class if omitted).
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-db-backup
  labels:
    app.kubernetes.io/name: grafana-db-backup
    app.kubernetes.io/part-of: grafana
spec:
  schedule: "15 1 * * *"
  timeZone: Etc/UTC
  # Still run a missed backup if the controller comes back within an hour.
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-db-backup
            app.kubernetes.io/part-of: grafana
            grafana-db-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/zone
                        operator: In
                        values:
                          - zone-a
                          - zone-b
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: registry.redhat.io/rhel9/postgresql-16:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: grafana-postgresql
                - name: HOME
                  value: /tmp
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-db
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: grafana-db
                      key: database
                # Number of dumps kept (one per day by default).
                - name: KEEP_BACKUPS
                  value: "14"
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  out="/backup/grafana-${ts}.dump"
                  # Leftovers of an interrupted run would fill the volume.
                  rm -f /backup/*.tmp
                  pg_dump --format=custom --no-owner --file="${out}.tmp"
                  # Keep the dump only if pg_restore can read its table of contents.
                  pg_restore --list "${out}.tmp" > /dev/null
                  mv "${out}.tmp" "${out}"
                  echo "backup written: ${out} ($(wc -c < "${out}") bytes)"
                  # Retention by count; coreutils only (no find/xargs in the image).
                  i=0
                  for f in $(ls -1t /backup/grafana-*.dump); do
                    i=$((i + 1))
                    if [ "$i" -gt "${KEEP_BACKUPS}" ]; then rm -f "$f"; echo "removed old backup: $f"; fi
                  done
                  echo "backups kept:"
                  ls -l /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: grafana-db-backup
