# PostgreSQL for the Grafana database: one instance on a replicated block volume.
#
# Availability comes from the storage (volume replicated across nodes), not from
# PostgreSQL replication: if the node is lost, the pod restarts on another node
# with the same data. Grafana is unavailable for that time (typically 1-2 min).
#
# Runs with an arbitrary UID (OpenShift restricted-v2): the official image
# handles a UID without a passwd entry (nss_wrapper) and only needs the data
# directory to be writable, which fsGroup on the volume provides.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-postgresql
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/part-of: grafana
spec:
  serviceName: grafana-postgresql-hl
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-postgresql
        app.kubernetes.io/part-of: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=150
            - -c
            - shared_buffers=128MB
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: database
            # PostgreSQL 18 image layout: volume at /var/lib/postgresql,
            # cluster in a version-specific sub-directory (eases major upgrades).
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grafana-postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName is set by the overlay (default class if omitted).
        resources:
          requests:
            storage: 10Gi
