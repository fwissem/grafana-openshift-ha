# PostgreSQL for the Grafana database: one instance on a replicated block volume.
#
# Availability comes from the storage (volume replicated across nodes), not from
# PostgreSQL replication: if the node is lost, the pod restarts on another node
# with the same data. Grafana is unavailable for that time (typically 1-2 min).
#
# Runs in the two data zones only (never in the quorum zone).
#
# Image: Red Hat registry.redhat.io/rhel9/postgresql-16 (supported with the
# OpenShift subscription, RHEL security errata). Built for OpenShift: runs with
# the arbitrary UID of restricted-v2 (group 0 permissions, nss_wrapper) and
# configures itself from the POSTGRESQL_* variables. registry.redhat.io needs
# the cluster pull secret (or an internal mirror). Pin the digest in the overlay.
# The kind test overlay swaps in quay.io/sclorg/postgresql-16-c9s, the community
# build of the same image (same scripts and variables), which needs no login.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-postgresql
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/part-of: grafana
spec:
  serviceName: grafana-postgresql-hl
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-postgresql
        app.kubernetes.io/part-of: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # Data zones only, never the quorum zone. Zone names are set by the overlay.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - zone-a
                      - zone-b
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: database
            # 4 Grafana replicas x max_open_conn 25 = 100, plus backup/restore.
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: "150"
            - name: POSTGRESQL_SHARED_BUFFERS
              value: 128MB
            # Logs to the container output instead of files in the data volume.
            - name: POSTGRESQL_LOG_DESTINATION
              value: /dev/stderr
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: run
              mountPath: /run/postgresql
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grafana-postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName is set by the overlay (default class if omitted).
        resources:
          requests:
            storage: 10Gi
