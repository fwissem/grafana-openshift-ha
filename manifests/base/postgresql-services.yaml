# Client service (used by Grafana and the backup job) and the headless service
# required by the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: grafana-postgresql
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/part-of: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-postgresql-hl
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/part-of: grafana
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: grafana-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
