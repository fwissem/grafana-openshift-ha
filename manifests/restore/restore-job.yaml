# One-shot restore of the Grafana database from a dump on the backup volume.
#
# NOT part of the kustomize base: applied on purpose, during a restore only.
# Grafana must be scaled to 0 first (see docs/RUNBOOK.md, "Restore"):
#
#   kubectl -n <ns> scale deployment/grafana --replicas=0
#   kubectl -n <ns> apply -k manifests/restore
#   kubectl -n <ns> wait --for=condition=complete job/grafana-db-restore --timeout=600s
#   kubectl -n <ns> logs job/grafana-db-restore
#   kubectl -n <ns> delete job grafana-db-restore
#   kubectl -n <ns> scale deployment/grafana --replicas=3
#
# BACKUP_FILE: a file name under /backup, or "latest" for the newest dump.
# On OpenShift, apply it in the Grafana namespace: the SCC assigns the UID.
# On a plain Kubernetes test cluster, add runAsUser / fsGroup as for PostgreSQL.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-db-restore
  labels:
    app.kubernetes.io/name: grafana-db-restore
    app.kubernetes.io/part-of: grafana
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-db-restore
        app.kubernetes.io/part-of: grafana
        grafana-db-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-restore
          image: docker.io/library/postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKUP_FILE
              value: latest
            - name: PGHOST
              value: grafana-postgresql
            - name: HOME
              value: /tmp
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: database
          command:
            - sh
            - -c
            - |
              set -eu
              if [ "${BACKUP_FILE}" = "latest" ]; then
                f="$(ls -1t /backup/grafana-*.dump | head -n 1)"
              else
                f="/backup/${BACKUP_FILE}"
              fi
              [ -f "$f" ] || { echo "backup not found: $f"; exit 1; }
              echo "restoring $f into database ${PGDATABASE}"
              active="$(psql -tAc "select count(*) from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid()")"
              if [ "$active" != "0" ]; then
                echo "refusing: $active other connection(s) to ${PGDATABASE}. Scale Grafana to 0 first."
                exit 1
              fi
              pg_restore --clean --if-exists --no-owner --single-transaction --exit-on-error -d "${PGDATABASE}" "$f"
              echo "restore done"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: grafana-db-backup
